services:
  postgresql:
    container_name: sonarqube-postgresql
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - ./storage/postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
      POSTGRES_DB: sonarqube

  sonarqube:
    container_name: local-sonarqube
    image: sonarqube:community
    restart: unless-stopped
    ports:
      - '9000:9000'
    volumes:
      - ./storage/sonarqube_data:/opt/sonarqube/data
      - ./storage/sonarqube_logs:/opt/sonarqube/logs
      - ./storage/sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - postgresql
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgresql:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
